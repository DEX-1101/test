
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>x1101 Workspace</title>
    <meta name="theme-color" content="#1c1c1c" />
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/DEX-1101/SecretNAI/refs/heads/main/avatar.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Segoe UI Variable Text', 'Segoe UI', 'Inter', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              background: '#1c1c1c',
              surface: '#2b2b2b',
              primary: '#e4e4e7',
              accent: '#60cdff',
              themePrimary: 'var(--theme-primary)',
              themePrimaryHover: 'var(--theme-primary-hover)',
              themeBtn: 'var(--theme-btn-bg)',
              themeBtnHover: 'var(--theme-btn-hover)',
              themeBtnText: 'var(--theme-btn-text)',
              themeBorder: 'var(--theme-border)',
            },
            animation: {
              'shimmer': 'shimmer 3s ease-in-out infinite',
              'gradient': 'gradient 8s ease infinite',
            },
            keyframes: {
              'shimmer': {
                '0%': { transform: 'translateX(100%)' },
                '50%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(100%)' },
              },
              'gradient': {
                '0%, 100%': { 'background-position': '0% 50%' },
                '50%': { 'background-position': '100% 50%' },
              }
            }
          }
        }
      }
    </script>
    <style>
      :root{
        --bg:#1c1c1c; --layer:#242424; --card:#2b2b2b; --card-hover:#323232; --stroke:rgba(255,255,255,.08);
        --text:#fff; --text-2:rgba(255,255,255,.72); --text-3:rgba(255,255,255,.5);
        --accent:#60cdff; --accent-2:#4cc2ff; --ease:cubic-bezier(.16,1,.3,1);
        --theme-primary:#60cdff; --theme-primary-hover:#4cc2ff; --theme-btn-bg:#2b2b2b; --theme-btn-hover:#363636;
        --theme-btn-text:#fff; --theme-border:rgba(255,255,255,.08);
        color-scheme: dark;
      }
      html,body,#root{height:100%;margin:0;overflow:hidden}
      body{background:var(--bg);color:var(--text);font-family:'Segoe UI Variable Text','Segoe UI','Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
      input,textarea,[contenteditable],pre,code,.selectable{user-select:text}
      ::selection{background:rgba(96,205,255,.35)}
      ::-webkit-scrollbar{width:10px;height:10px}
      ::-webkit-scrollbar-track{background:transparent}
      ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:10px;border:3px solid transparent;background-clip:content-box}
      ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.32);background-clip:content-box;border:3px solid transparent}
      :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

      /* Win11 surfaces & shape: restyles utility classes used inside the editors */
      #root .rounded-3xl{border-radius:12px}
      #root .rounded-2xl{border-radius:10px}
      #root .rounded-xl{border-radius:8px}
      #root .bg-white\/5{background-color:var(--card)}
      #root .bg-white\/10{background-color:var(--card-hover)}
      #root .hover\:bg-white\/10:hover{background-color:var(--card-hover)}
      #root .border-white\/10,#root .border-white\/5{border-color:var(--stroke)}
      #root .bg-zinc-900,#root .bg-zinc-900\/50,#root .bg-zinc-900\/80{background-color:var(--layer)}
      #root .bg-black\/40,#root .bg-black\/50,#root .bg-black\/60{background-color:rgba(32,32,32,.78)}
      #root .bg-black\/80,#root .bg-slate-950\/90{background-color:rgba(28,28,28,.92)}
      #root .backdrop-blur-xl,#root .backdrop-blur-2xl,#root .backdrop-blur-md{backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%)}
      #root .shadow-2xl{box-shadow:0 8px 32px rgba(0,0,0,.36),0 0 0 1px var(--stroke)}
      #root button,#root input,#root select,#root textarea{transition:background-color .18s var(--ease),border-color .18s var(--ease),transform .18s var(--ease),opacity .18s var(--ease),box-shadow .18s var(--ease)}
      #root button:not(:disabled):active{transform:scale(.97)}
      #root input:focus,#root textarea:focus,#root select:focus{border-color:var(--accent)!important;box-shadow:0 1px 0 0 var(--accent)}
      #root .text-accent,#root .text-blue-400,#root .text-blue-500{color:var(--accent)}
      #root .bg-blue-600,#root .bg-blue-500{background-color:#0067c0}
      #root .bg-blue-600:hover,#root .bg-blue-500:hover{background-color:#1975c5}

      /* tailwindcss-animate shims (the CDN build doesn't ship these, so they were silently no-ops) */
      @keyframes w11-in{from{opacity:0;transform:translate3d(var(--tx,0),var(--ty,0),0) scale(var(--ts,1))}to{opacity:1;transform:none}}
      .animate-in{animation:w11-in .35s var(--ease) both}
      .slide-in-from-bottom-4{--ty:16px}.slide-in-from-top-2{--ty:-8px}.slide-in-from-top-4{--ty:-16px}
      .slide-in-from-right-4{--tx:16px}.slide-in-from-left-4{--tx:-16px}
      .zoom-in-95{--ts:.95}.zoom-in-90{--ts:.9}
      .duration-200{animation-duration:.2s}.duration-300{animation-duration:.3s}.duration-500{animation-duration:.5s}
      @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
    </style>
  </head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
