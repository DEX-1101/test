
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>x1101 Workspace</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/DEX-1101/SecretNAI/refs/heads/main/avatar.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Segoe UI Variable Text', 'Segoe UI Variable', 'Segoe UI', 'Inter', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              background: '#202020',
              surface: '#2b2b2b',
              primary: '#e4e4e7',
              accent: '#60cdff',
              themePrimary: 'var(--theme-primary)',
              themePrimaryHover: 'var(--theme-primary-hover)',
              themeBtn: 'var(--theme-btn-bg)',
              themeBtnHover: 'var(--theme-btn-hover)',
              themeBtnText: 'var(--theme-btn-text)',
              themeBorder: 'var(--theme-border)',
            },
            animation: {
              'shimmer': 'shimmer 3s ease-in-out infinite',
              'gradient': 'gradient 8s ease infinite',
              'win-spin': 'winspin 1.1s cubic-bezier(.4,.1,.3,.9) infinite',
            },
            keyframes: {
              'shimmer': {
                '0%': { transform: 'translateX(100%)' },
                '50%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(100%)' },
              },
              'winspin': { to: { transform: 'rotate(360deg)' } },
              'gradient': {
                '0%, 100%': { 'background-position': '0% 50%' },
                '50%': { 'background-position': '100% 50%' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* ===== Windows 11 (Fluent) design tokens - dark theme ===== */
      :root {
        --win-mica: #202020;
        --win-layer: rgba(255,255,255,0.0512);
        --win-layer-alt: rgba(255,255,255,0.0326);
        --win-layer-hover: rgba(255,255,255,0.0837);
        --win-stroke: rgba(255,255,255,0.0837);
        --win-stroke-strong: rgba(255,255,255,0.1395);
        --win-text: #ffffff;
        --win-text-2: rgba(255,255,255,0.786);
        --win-text-3: rgba(255,255,255,0.544);
        --win-accent: #60cdff;
        --win-accent-hover: #4cc2ff;
        --win-accent-text: #00263a;
        --win-radius-ctl: 6px;
        --win-radius-card: 8px;
        --win-radius-flyout: 12px;
        --win-shadow-card: 0 2px 4px rgba(0,0,0,.14);
        --win-shadow-flyout: 0 8px 16px rgba(0,0,0,.28), 0 0 0 1px rgba(0,0,0,.2);

        --theme-primary: #60cdff;
        --theme-primary-hover: #4cc2ff;
        --theme-btn-bg: #60cdff;
        --theme-btn-hover: #4cc2ff;
        --theme-btn-text: #00263a;
        --theme-border: rgba(255, 255, 255, 0.0837);
      }
      body[data-theme="blue"]   { --theme-primary:#3b82f6; --theme-primary-hover:#2563eb; --theme-btn-bg:#2563eb; --theme-btn-hover:#1d4ed8; --theme-btn-text:#fff; --theme-border:rgba(37,99,235,.5); }
      body[data-theme="purple"] { --theme-primary:#a855f7; --theme-primary-hover:#9333ea; --theme-btn-bg:#9333ea; --theme-btn-hover:#7e22ce; --theme-btn-text:#fff; --theme-border:rgba(147,51,234,.5); }
      body[data-theme="red"]    { --theme-primary:#ef4444; --theme-primary-hover:#dc2626; --theme-btn-bg:#dc2626; --theme-btn-hover:#b91c1c; --theme-btn-text:#fff; --theme-border:rgba(220,38,38,.5); }

      html { color-scheme: dark; }
      body {
        background-color: var(--win-mica);
        /* Mica-like wallpaper tint */
        background-image:
          radial-gradient(60% 50% at 12% 0%, rgba(96,205,255,0.10) 0%, transparent 70%),
          radial-gradient(50% 45% at 92% 10%, rgba(120,110,255,0.08) 0%, transparent 70%);
        background-attachment: fixed;
        color: var(--win-text);
        font-family: 'Segoe UI Variable Text','Segoe UI Variable','Segoe UI','Inter',system-ui,sans-serif;
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
      }

      /* ===== Surfaces: remap the existing glass utilities to Fluent layers ===== */
      body .bg-white\/5  { background-color: var(--win-layer) !important; }
      body .bg-white\/10 { background-color: var(--win-layer-hover) !important; }
      body .hover\:bg-white\/5:hover  { background-color: var(--win-layer) !important; }
      body .hover\:bg-white\/10:hover { background-color: var(--win-layer-hover) !important; }
      body .hover\:bg-white\/20:hover { background-color: rgba(255,255,255,0.11) !important; }
      body .border-white\/5  { border-color: var(--win-stroke) !important; }
      body .border-white\/10 { border-color: var(--win-stroke) !important; }
      body .border-white\/20 { border-color: var(--win-stroke-strong) !important; }
      body .bg-black\/20 { background-color: rgba(0,0,0,0.18) !important; }
      body .bg-black\/40 { background-color: rgba(32,32,32,0.72) !important; }
      body .bg-black\/50 { background-color: rgba(32,32,32,0.80) !important; }
      body .bg-black\/60 { background-color: rgba(32,32,32,0.86) !important; }
      body .bg-black\/80 { background-color: rgba(28,28,28,0.92) !important; }

      /* Acrylic for blurred panels */
      body .backdrop-blur-md, body .backdrop-blur-xl, body .backdrop-blur-2xl {
        -webkit-backdrop-filter: blur(30px) saturate(1.25);
        backdrop-filter: blur(30px) saturate(1.25);
      }

      /* ===== Corner radii: Windows 11 uses 4 / 8 / 12 px ===== */
      body .rounded-md  { border-radius: 4px !important; }
      body .rounded-lg  { border-radius: var(--win-radius-ctl) !important; }
      body .rounded-xl  { border-radius: var(--win-radius-card) !important; }
      body .rounded-2xl { border-radius: var(--win-radius-flyout) !important; }
      body .rounded-3xl { border-radius: var(--win-radius-flyout) !important; }

      /* Softer, Fluent elevation instead of heavy glows */
      body .shadow-2xl { box-shadow: var(--win-shadow-flyout) !important; }
      body .shadow-xl, body .shadow-lg { box-shadow: 0 4px 8px rgba(0,0,0,.2) !important; }
      body .shadow-sm { box-shadow: var(--win-shadow-card) !important; }

      /* ===== Text hierarchy ===== */
      body .text-zinc-300, body .text-slate-300 { color: var(--win-text-2) !important; }
      body .text-zinc-400, body .text-slate-400 { color: var(--win-text-3) !important; }
      body .text-indigo-400, body .text-indigo-300 { color: var(--win-accent) !important; }
      body .hover\:text-indigo-300:hover, body .hover\:text-indigo-400:hover { color: var(--win-accent-hover) !important; }

      /* ===== Controls ===== */
      button { transition: background-color .12s ease, border-color .12s ease, color .12s ease, transform .08s ease, opacity .12s ease; }
      button:not(:disabled):active { transform: scale(.98); }
      button:focus-visible, a:focus-visible, [tabindex]:focus-visible {
        outline: 2px solid var(--win-accent); outline-offset: 2px;
      }

      /* Text boxes: Fluent fill + accent bottom border on focus */
      input:not([type=range]):not([type=checkbox]):not([type=radio]):not([type=file]):not([type=color]),
      textarea, select {
        background-color: rgba(255,255,255,0.0605);
        border: 1px solid var(--win-stroke);
        border-bottom-color: rgba(255,255,255,0.5442);
        border-radius: var(--win-radius-ctl);
        color: var(--win-text);
        transition: background-color .12s ease, border-color .12s ease;
      }
      input:not([type=range]):not([type=checkbox]):not([type=radio]):not([type=file]):not([type=color]):hover,
      textarea:hover, select:hover { background-color: rgba(255,255,255,0.0837); }
      input:not([type=range]):not([type=checkbox]):not([type=radio]):not([type=file]):not([type=color]):focus,
      textarea:focus, select:focus {
        background-color: rgba(30,30,30,0.7);
        border-color: var(--win-stroke);
        border-bottom: 2px solid var(--win-accent);
        outline: none; box-shadow: none;
      }
      select option { background: #2b2b2b; color: #fff; }
      input[type=range], input[type=checkbox], input[type=radio] { accent-color: var(--win-accent); }
      ::placeholder { color: var(--win-text-3); }
      ::selection { background: var(--win-accent); color: #000; }

      /* ===== Windows 11 thin overlay scrollbars ===== */
      ::-webkit-scrollbar { width: 14px; height: 14px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.46); border-radius: 10px;
        border: 5px solid transparent; background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.62); background-clip: content-box; border-width: 4px; }
      ::-webkit-scrollbar-corner { background: transparent; }

      /* ===== App shell ===== */
      .win-titlebar {
        background: rgba(32,32,32,0.72);
        -webkit-backdrop-filter: blur(40px) saturate(1.3); backdrop-filter: blur(40px) saturate(1.3);
        border: 1px solid var(--win-stroke);
        border-radius: var(--win-radius-flyout);
        box-shadow: var(--win-shadow-flyout);
      }
      .win-tab {
        position: relative; display: flex; align-items: center; gap: 8px; white-space: nowrap;
        padding: 8px 14px; border-radius: var(--win-radius-ctl);
        font-size: 13px; font-weight: 400; color: var(--win-text-2);
        background: transparent; border: 0;
      }
      .win-tab:hover { background: var(--win-layer-hover); color: var(--win-text); }
      .win-tab[aria-selected="true"] { background: var(--win-layer-hover); color: var(--win-text); font-weight: 600; }
      .win-tab[aria-selected="true"]::after {   /* NavigationView-style selection pill */
        content: ''; position: absolute; left: 50%; bottom: 2px; width: 16px; height: 3px;
        transform: translateX(-50%); border-radius: 3px; background: var(--win-accent);
      }
      .win-tab svg { color: inherit; }
      .win-tab[aria-selected="true"] svg { color: var(--win-accent); }
      .win-ring { width: 40px; height: 40px; border-radius: 50%; border: 4px solid rgba(255,255,255,.12); border-top-color: var(--win-accent); }
      .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { scrollbar-width: none; }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "@zip.js/zip.js": "https://esm.sh/@zip.js/zip.js@2.7.34"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
